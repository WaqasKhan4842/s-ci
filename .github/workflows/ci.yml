name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

    # Task 2: Add caching step here
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

  
    # Task 3: Add install, test, and upload-artifact steps here

      - name: Install & Test
        run: npm install && npm test > test-output.txt

      - name: Upload test results
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-output.txt
    # Task 4: Add "create issue on failure" step at the bottom
    # Task 5: Add "generate and upload image" step here
      